name: Publish My Cycle 1.1.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v1.1.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Download verified unsigned APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9612600985/zip" \
            -o unsigned.zip
          mkdir unsigned
          unzip -q unsigned.zip -d unsigned
          test -f unsigned/app-release-unsigned.apk
          echo "bbe221d1c1248f1babc1dcd6f01c62962321d203922359d311a157d789ad230f  unsigned/app-release-unsigned.apk" | sha256sum -c -

      - name: Reconstruct signed APK
        run: |
          set -euo pipefail
          cat \
            .github/release/v1.1.0-signature.seg01a.b64 \
            .github/release/v1.1.0-signature.seg01b.b64 \
            .github/release/v1.1.0-signature.seg02.b64 \
            .github/release/v1.1.0-signature.seg03.b64 \
            .github/release/v1.1.0-signature.seg04.b64 \
            .github/release/v1.1.0-signature.part1b.b64 \
            .github/release/v1.1.0-signature.part2.b64 \
            .github/release/v1.1.0-signature.part3.b64 \
            .github/release/v1.1.0-signature.part4.b64 \
            .github/release/v1.1.0-signature.part5.b64 \
            .github/release/v1.1.0-signature.part6.b64 \
            > signature.patch.b64
          echo "a3fe4c46026a3f2f23c1e04f477b0519ccbbac78fba0cbb1ce985ca726557f52  signature.patch.b64" | sha256sum -c -
          base64 -d signature.patch.b64 > signature.patch.zst
          echo "6d24eb39520c263748bffcbb951e40cfe5d38517f35a8360a7b584158e47ac2f  signature.patch.zst" | sha256sum -c -
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
          zstd -d \
            --patch-from=unsigned/app-release-unsigned.apk \
            signature.patch.zst \
            -o My-Cycle-v1.1.0.apk
          echo "a8991c51f08421c31e0a53a1a2cb1243239e3dd044177ecfa8137e903c461f69  My-Cycle-v1.1.0.apk" | sha256sum -c -

      - name: Verify Android package and signature
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS_DIR/aapt" dump badging My-Cycle-v1.1.0.apk | tee package-info.txt
          grep -q "package: name='com.silverlightning.mycycle' versionCode='2' versionName='1.1.0'" package-info.txt
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs My-Cycle-v1.1.0.apk | tee signature-verification.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature-verification.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" signature-verification.txt
          grep -q "CN=Stanley Lloyd" signature-verification.txt
          grep -qi "f02571c40741e2cb071564f5b63fd3dc38a875d0eda11a8c42269ed635bc2a58" signature-verification.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          # My Cycle 1.1.0

          A safer and clearer update for people whose periods are new, uneven, changing with age, or have stopped.

          ## What changed
          - The next period is shown as a possible range of dates instead of one supposedly exact day.
          - Setup now asks which simple description best matches the user's periods.
          - The first years after periods begin use wider estimates because timing often changes a lot.
          - Long-term uneven periods and periods changing with age also use wider estimates.
          - A few spots of blood are kept separate from a real period and do not start a new cycle.
          - Short real cycles are kept in history instead of being silently ignored.
          - Calendar guesses about egg release are hidden when the history is too uneven or too new.
          - Possible pregnancy days are shown only after enough fairly steady adult history, and are never described as safe days.
          - Simple attention notes were added for very long gaps, bleeding that lasts unusually long, and new bleeding after about a year without periods.
          - Existing 1.0.0 users keep all their history. They only need to choose the new period pattern once in Settings.
          - User-facing wording was simplified in English and Russian.

          ## Privacy
          No account, analytics, ads or internet permission. Cycle records stay on the device unless the user explicitly exports them to CSV.

          ## Important
          My Cycle gives calendar estimates, not medical answers. It is not a medical device and must not be used as contraception or instead of medical advice.

          **Author:** Stanley Lloyd  
          **Application ID:** `com.silverlightning.mycycle`  
          **License:** PolyForm Noncommercial License 1.0.0

          SHA-256 (`My-Cycle-v1.1.0.apk`): `a8991c51f08421c31e0a53a1a2cb1243239e3dd044177ecfa8137e903c461f69`
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.1.0 My-Cycle-v1.1.0.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v1.1.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target 3807cd2d56cc4f3d3135ea242793f670f5516250 \
              --title "My Cycle 1.1.0" \
              --notes-file release-notes.md
          else
            gh release create v1.1.0 My-Cycle-v1.1.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target 3807cd2d56cc4f3d3135ea242793f670f5516250 \
              --title "My Cycle 1.1.0" \
              --notes-file release-notes.md
          fi
