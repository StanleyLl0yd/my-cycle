name: Refresh KSP verification metadata

on:
  push:
    branches: [ chore/ksp-2.3.11 ]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.5.0'

      - name: Generate verification metadata and verify build
        run: |
          gradle --write-verification-metadata sha256 --refresh-dependencies assembleDebug assembleRelease test lint detekt
          gradle --dependency-verification=strict assembleDebug assembleRelease test lint detekt

      - name: Commit verification metadata
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "Verification metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "Update Gradle verification metadata for KSP 2.3.11"
          git push origin HEAD:chore/ksp-2.3.11
