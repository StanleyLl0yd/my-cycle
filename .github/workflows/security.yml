name: Security Scans

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-security.txt

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check -r requirements-security.txt

      - name: Run Semgrep
        run: semgrep scan --config p/security-audit --config p/secrets --error --metrics=off .

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch Gradle source verification metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("gradle/verification-metadata.xml")
          text = path.read_text()
          checksum = "35a2f2e7a07e70086174d6e57a9e8bfa57db9a57e425d7fb8e28f37d6204e31c"
          artifact = "gradle-9.6.0-src.zip"
          if artifact not in text:
              marker = '      <component group="io.github.detekt.sarif4k"'
              block = (
                  '      <component group="gradle" name="gradle" version="9.6.0">\n'
                  '         <artifact name="gradle-9.6.0-src.zip">\n'
                  f'            <sha256 value="{checksum}" origin="Gradle distribution checksum"/>\n'
                  '         </artifact>\n'
                  '      </component>\n'
              )
              if marker not in text:
                  raise SystemExit("verification metadata insertion point not found")
              path.write_text(text.replace(marker, block + marker, 1))
          PY
          if ! git diff --quiet -- gradle/verification-metadata.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradle/verification-metadata.xml
            git commit -m "Verify Gradle 9.6.0 source archive"
            git push origin HEAD:policy/repository-audit-refactoring
          fi

      - name: Run Qodana
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692
        with:
          args: --linter qodana-jvm-community --within-docker false --only-directory app/src
          upload-result: true
          use-annotations: true
          pr-mode: false
          post-pr-comment: false
