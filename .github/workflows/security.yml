name: Security Scans

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-security.txt

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check -r requirements-security.txt

      - name: Run Semgrep
        run: semgrep scan --config p/security-audit --config p/secrets --error --metrics=off .

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare Gradle dependencies
        run: ./gradlew :app:dependencies --stacktrace

      - name: Trust IDE-only Gradle attachments
        shell: python
        run: |
          from pathlib import Path

          path = Path("gradle/verification-metadata.xml")
          text = path.read_text(encoding="utf-8")
          marker = "      <verify-signatures>false</verify-signatures>\n"
          trusted = """      <trusted-artifacts>
             <trust file=".*-javadoc[.]jar" regex="true" reason="IDE-only documentation attachments are not executed or packaged"/>
             <trust file=".*-sources[.]jar" regex="true" reason="IDE-only source attachments are not executed or packaged"/>
             <trust file="gradle-.*-src[.]zip" regex="true" reason="IDE-only Gradle source attachment is not executed or packaged"/>
          </trusted-artifacts>
          """
          if "<trusted-artifacts>" not in text:
              if marker not in text:
                  raise SystemExit("Gradle verification metadata configuration marker not found")
              path.write_text(text.replace(marker, marker + trusted, 1), encoding="utf-8")

      - name: Allow newer AGP during Qodana IDE sync
        shell: python
        run: |
          from pathlib import Path

          path = Path("gradle.properties")
          text = path.read_text(encoding="utf-8") if path.exists() else ""
          key = "android.injected.studio.version.check"
          if not any(line.strip().startswith(f"{key}=") for line in text.splitlines()):
              if text and not text.endswith("\n"):
                  text += "\n"
              text += f"{key}=false\n"
              path.write_text(text, encoding="utf-8")

      - name: Run Qodana
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692
        with:
          args: --within-docker,false,--print-problems
          pr-mode: false
          upload-result: true
          artifact-name: qodana-report
