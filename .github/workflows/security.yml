name: Security Scans

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-security.txt

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check -r requirements-security.txt

      - name: Run Semgrep
        run: semgrep scan --config p/security-audit --config p/secrets --error --metrics=off .

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Add Qodana import dependency checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("gradle/verification-metadata.xml")
          text = path.read_text(encoding="utf-8")
          marker = "   </components>"
          if 'name="kotlin-reflect" version="2.3.21"' not in text:
              entries = '''      <component group="org.jetbrains.kotlin" name="kotlin-reflect" version="2.3.21">
                 <artifact name="kotlin-reflect-2.3.21.jar">
                    <sha256 value="33e37d9dfa86c7a29ab34e975b5f4a1287b458878611051f3485652220c1a2cb" origin="Qodana Gradle import"/>
                 </artifact>
                 <artifact name="kotlin-reflect-2.3.21.pom">
                    <sha256 value="7e3c2fe5cf3494a9b47525580c38c35c43d6e3682e6a0b2f565954e19a72d639" origin="Qodana Gradle import"/>
                 </artifact>
              </component>
              <component group="org.jetbrains.kotlin" name="kotlin-stdlib" version="2.3.21">
                 <artifact name="kotlin-stdlib-2.3.21.jar">
                    <sha256 value="6f64eac736db9434dd6925b4a518b9d1d17177652320c37916cf9ba3ce7d7d7a" origin="Qodana Gradle import"/>
                 </artifact>
                 <artifact name="kotlin-stdlib-2.3.21.module">
                    <sha256 value="7b4ea4b2242bb177a4b4abb63c3f3d857331d40d35865e36fcc3db666ec10174" origin="Qodana Gradle import"/>
                 </artifact>
              </component>
              <component group="org.jetbrains.kotlin" name="kotlin-stdlib-common" version="2.3.21">
                 <artifact name="kotlin-stdlib-common-2.3.21.module">
                    <sha256 value="6ad2f57891a54d96a6922112f758df957ce1ab8a3d5a57215cb74fa3e105e255" origin="Qodana Gradle import"/>
                 </artifact>
              </component>
          '''
              text = text.replace(marker, entries + marker)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Run Qodana
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692
        with:
          args: --linter qodana-jvm-community --within-docker false --only-directory app/src
          upload-result: true
          use-annotations: true
          pr-mode: false
          post-pr-comment: false
