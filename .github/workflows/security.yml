name: Security and Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * 1"

permissions: {}

concurrency:
  group: security-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep CE
        run: semgrep scan --config p/security-audit --config p/secrets --error --metrics=off .

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  qodana:
    name: Qodana
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: "21.0.12.1"
          cache: gradle

      - name: Prepare Gradle dependencies
        run: ./gradlew --dependency-verification=strict :app:dependencies --stacktrace

      - name: Trust IDE-only Gradle attachments
        shell: python
        run: |
          from pathlib import Path

          path = Path("gradle/verification-metadata.xml")
          text = path.read_text(encoding="utf-8")
          marker = "      <verify-signatures>false</verify-signatures>\n"
          trusted = """      <trusted-artifacts>
             <trust file=".*-javadoc[.]jar" regex="true" reason="IDE-only documentation attachments are not executed or packaged"/>
             <trust file=".*-sources[.]jar" regex="true" reason="IDE-only source attachments are not executed or packaged"/>
             <trust file="gradle-.*-src[.]zip" regex="true" reason="IDE-only Gradle source attachment is not executed or packaged"/>
          </trusted-artifacts>
          """
          if "<trusted-artifacts>" not in text:
              if marker not in text:
                  raise SystemExit("Gradle verification metadata configuration marker not found")
              path.write_text(text.replace(marker, marker + trusted, 1), encoding="utf-8")

      - name: Run Qodana
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          args: --within-docker,false,--print-problems
          pr-mode: false
          upload-result: true
          artifact-name: qodana-report
