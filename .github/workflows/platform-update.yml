name: Platform Update

on:
  push:
    branches:
      - codex/android-platform-dependency-update

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update Android toolchain and dependencies
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            -e 's/agp = "8.13.2"/agp = "9.3.2"/' \
            -e 's/kotlin = "2.3.0"/kotlin = "2.4.10"/' \
            -e 's/ksp = "2.3.0"/ksp = "2.3.10"/' \
            -e 's/composeBom = "2025.12.00"/composeBom = "2026.08.00"/' \
            -e 's/coreKtx = "1.16.0"/coreKtx = "1.19.0"/' \
            -e 's/lifecycleVersion = "2.10.0"/lifecycleVersion = "2.11.0"/' \
            -e 's/activityCompose = "1.10.1"/activityCompose = "1.13.0"/' \
            -e 's/navigationCompose = "2.9.0"/navigationCompose = "2.10.0"/' \
            -e 's/datastorePreferences = "1.1.4"/datastorePreferences = "1.2.1"/' \
            -e 's/koinBom = "4.1.1"/koinBom = "4.2.2"/' \
            -e 's/coroutines = "1.10.1"/coroutines = "1.11.0"/' \
            gradle/libs.versions.toml

          sed -i '/kotlin-android = { id = "org.jetbrains.kotlin.android"/d' gradle/libs.versions.toml
          sed -i '/alias(libs.plugins.kotlin.android)/d' build.gradle.kts app/build.gradle.kts
          sed -i \
            -e 's/compileSdk = 36/compileSdk = 37/' \
            -e 's/targetSdk = 36/targetSdk = 37/' \
            app/build.gradle.kts

          for file in .github/workflows/ci.yml .github/workflows/release.yml; do
            sed -i \
              -e 's/Set up Gradle 8\.13/Set up Gradle 9.5.0/g' \
              -e "s/gradle-version: '8\.13'/gradle-version: '9.5.0'/g" \
              "$file"
          done

          for file in README.md README.ru.md CONTRIBUTING.md CONTRIBUTING.ru.md; do
            sed -i \
              -e 's/Target SDK: \*\*36\*\*/Target SDK: **37**/g' \
              -e 's/Android SDK 36/Android SDK 37/g' \
              -e 's/Gradle 8\.13/Gradle 9.5.0/g' \
              -e 's/Kotlin 2\.3\.0/Kotlin 2.4.10/g' \
              -e 's/Koin 4\.1\.1/Koin 4.2.2/g' \
              -e 's/DataStore 1\.1\.4/DataStore 1.2.1/g' \
              -e 's/AGP 8\.13\.2/AGP 9.3.2/g' \
              "$file"
          done

          if grep -R --line-number -E 'AGP 8\.13\.2|Gradle 8\.13|Kotlin 2\.3\.0|Koin 4\.1\.1|DataStore 1\.1\.4|compileSdk = 36|targetSdk = 36|org\.jetbrains\.kotlin\.android' \
            app build.gradle.kts gradle README.md README.ru.md CONTRIBUTING.md CONTRIBUTING.ru.md \
            .github/workflows/ci.yml .github/workflows/release.yml; then
            echo 'Old Android toolchain reference still exists.' >&2
            exit 1
          fi

      - name: Commit platform update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update Android platform and dependencies'
          git push
