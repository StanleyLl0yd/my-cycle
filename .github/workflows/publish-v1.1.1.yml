name: Finalize My Cycle 1.1.1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v1.1.1.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Sync release README files and remove one-time workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          release_url = "https://github.com/StanleyLl0yd/my-cycle/releases/tag/v1.1.1"
          drive_url = "https://drive.google.com/file/d/1IiLfnSOC_ETugALA6ufRzIeptsdjK0S5/view?usp=drivesdk"
          sha256 = "350ffa182220785bc3a53c11fd85f35d1135d0b932b80b06d35b57d0fab589b4"

          en_path = Path("README.md")
          en = en_path.read_text(encoding="utf-8")
          en = en.replace(
              "Latest published APK: **1.1.0**",
              "Latest published APK: **1.1.1**",
          )
          en_block = f"""## 📦 Installation

The latest published signed APK is **1.1.1**.

[Open My Cycle 1.1.1 on GitHub]({release_url})

[Download signed My-Cycle-v1.1.1.apk from Google Drive]({drive_url})

SHA-256 (`My-Cycle-v1.1.1.apk`): `{sha256}`

Android 8.0 or newer is required."""
          en, en_count = re.subn(
              r"## 📦 Installation\n\n.*?\n\nAndroid 8\.0 or newer is required\.",
              en_block,
              en,
              count=1,
              flags=re.S,
          )
          if en_count != 1:
              raise SystemExit("English installation block was not updated exactly once")
          en_path.write_text(en, encoding="utf-8")

          ru_path = Path("README.ru.md")
          ru = ru_path.read_text(encoding="utf-8")
          ru = ru.replace(
              "Последний опубликованный APK: **1.1.0**",
              "Последний опубликованный APK: **1.1.1**",
          )
          ru_block = f"""## 📦 Установка

Последний опубликованный подписанный APK — **1.1.1**.

[Открыть My Cycle 1.1.1 на GitHub]({release_url})

[Скачать подписанный My-Cycle-v1.1.1.apk с Google Drive]({drive_url})

SHA-256 (`My-Cycle-v1.1.1.apk`): `{sha256}`

Для установки требуется Android 8.0 или новее."""
          ru, ru_count = re.subn(
              r"## 📦 Установка\n\n.*?\n\nДля установки требуется Android 8\.0 или новее\.",
              ru_block,
              ru,
              count=1,
              flags=re.S,
          )
          if ru_count != 1:
              raise SystemExit("Russian installation block was not updated exactly once")
          ru_path.write_text(ru, encoding="utf-8")
          PY

          git rm .github/workflows/publish-v1.1.1.yml
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add README.md README.ru.md
          git diff --cached --check
          git commit -m "Clean release workflow and sync README for 1.1.1"
          git push origin HEAD:main
