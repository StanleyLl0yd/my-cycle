name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag, for example v1.3.2
        required: true
        type: string

permissions: {}

concurrency:
  group: android-release-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  EXPECTED_CERT_SHA256: f02571c40741e2cb071564f5b63fd3dc38a875d0eda11a8c42269ed635bc2a58

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Validate tag format
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Validate tag source and app version
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          namespace="$(sed -n 's/^[[:space:]]*namespace = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          application_id="$(sed -n 's/^[[:space:]]*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"

          test -n "$version_name"
          [[ "$version_code" =~ ^[0-9]+$ ]]
          (( version_code > 0 ))
          test "$namespace" = "com.sl.mycycle"
          test "$application_id" = "com.sl.mycycle"
          test "$RELEASE_TAG" = "v$version_name"
          test -f ".github/release-notes/$RELEASE_TAG.md"

          max_previous_code=0
          max_previous_tag=""
          while IFS= read -r tag; do
            [[ "$tag" == "$RELEASE_TAG" ]] && continue
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            previous_file="$(git show "${tag}:app/build.gradle.kts" 2>/dev/null || true)"
            [[ -n "$previous_file" ]] || continue
            previous_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' <<< "$previous_file" | head -1)"
            [[ "$previous_code" =~ ^[0-9]+$ ]] || continue
            if (( previous_code > max_previous_code )); then
              max_previous_code="$previous_code"
              max_previous_tag="$tag"
            fi
          done < <(git tag --list 'v*')

          if (( version_code <= max_previous_code )); then
            echo "versionCode $version_code must be greater than $max_previous_code from $max_previous_tag." >&2
            exit 1
          fi

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists and is immutable to automation." >&2
            exit 1
          fi

      - name: Require successful main verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          required_workflows=("Android CI" "Security and Quality" "CodeQL")

          for attempt in $(seq 1 40); do
            runs="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$release_sha&per_page=100")"
            pending=0

            for workflow in "${required_workflows[@]}"; do
              record="$(jq -c --arg name "$workflow" \
                '[.workflow_runs[] | select(.name == $name and .event == "push" and .head_branch == "main")] | sort_by(.created_at) | last // empty' \
                <<< "$runs")"

              if [[ -z "$record" ]]; then
                echo "$workflow: waiting for a main push run"
                pending=1
                continue
              fi

              status="$(jq -r '.status' <<< "$record")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$record")"
              run_url="$(jq -r '.html_url' <<< "$record")"

              if [[ "$status" != "completed" ]]; then
                echo "$workflow: $status ($run_url)"
                pending=1
              elif [[ "$conclusion" != "success" ]]; then
                echo "$workflow failed with conclusion '$conclusion': $run_url" >&2
                exit 1
              else
                echo "$workflow: success ($run_url)"
              fi
            done

            if (( pending == 0 )); then
              exit 0
            fi
            (( attempt < 40 )) && sleep 15
          done

          echo "Timed out waiting for required main verification workflows." >&2
          exit 1

  build-sign:
    name: Test, build, sign, and attest
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v5.0.0
        with:
          gradle-version: '9.5.0'
          cache-read-only: true

      - name: Restore and validate release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          umask 077
          keystore_path="$RUNNER_TEMP/my-cycle-release.jks"
          upload_cert_path="$RUNNER_TEMP/my-cycle-upload-cert.pem"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"

          key_info="$(
            keytool -list -v \
              -keystore "$keystore_path" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS"
          )"
          grep -Eq 'Subject Public Key Algorithm: ([2-9][0-9]{3,}|[1-9][0-9]{4,})-bit RSA key' <<< "$key_info"

          actual_fingerprint="$(
            awk -F': ' '/SHA256:/ {print $2; exit}' <<< "$key_info" |
              tr -d ': ' |
              tr '[:upper:]' '[:lower:]'
          )"
          test "$actual_fingerprint" = "$EXPECTED_CERT_SHA256"

          keytool -exportcert \
            -rfc \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$upload_cert_path"

          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "UPLOAD_CERT_PATH=$upload_cert_path" >> "$GITHUB_ENV"

      - name: Test and lint release source
        run: ./gradlew --dependency-verification=strict testDebugUnitTest lint --stacktrace

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --dependency-verification=strict assembleRelease bundleRelease --stacktrace

      - name: Verify signatures and package release
        id: package
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          source_aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$source_apk"
          test -s "$source_aab"

          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$aapt"
          test -n "$apksigner"

          package_name="$("$aapt" dump badging "$source_apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          test "$package_name" = "com.sl.mycycle"

          apk_report="$RUNNER_TEMP/apksigner-report.txt"
          "$apksigner" verify --verbose --print-certs "$source_apk" | tee "$apk_report"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$apk_report"
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' "$apk_report"
          grep -F 'Number of signers: 1' "$apk_report"
          apk_fingerprint="$(
            awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$apk_report" |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"
          test "$apk_fingerprint" = "$EXPECTED_CERT_SHA256"

          jarsigner -verify "$source_aab" | tee "$RUNNER_TEMP/jarsigner-report.txt"
          grep -F 'jar verified.' "$RUNNER_TEMP/jarsigner-report.txt"
          aab_fingerprint="$(
            keytool -printcert -jarfile "$source_aab" |
              awk -F': ' '/SHA256:/ {print $NF; exit}' |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"
          test "$aab_fingerprint" = "$EXPECTED_CERT_SHA256"

          version="${RELEASE_TAG#v}"
          mkdir -p release
          apk_path="release/My-Cycle-v$version.apk"
          aab_path="release/My-Cycle-v$version.aab"
          apk_checksum_path="$apk_path.sha256"
          aab_checksum_path="$aab_path.sha256"
          cert_path="release/My-Cycle-v$version-upload-cert.pem"

          cp "$source_apk" "$apk_path"
          cp "$source_aab" "$aab_path"
          cp "$UPLOAD_CERT_PATH" "$cert_path"
          sha256sum "$apk_path" | tee "$apk_checksum_path"
          sha256sum "$aab_path" | tee "$aab_checksum_path"
          sha256sum --check "$apk_checksum_path"
          sha256sum --check "$aab_checksum_path"

          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"
          echo "apk_checksum_path=$apk_checksum_path" >> "$GITHUB_OUTPUT"
          echo "aab_checksum_path=$aab_checksum_path" >> "$GITHUB_OUTPUT"
          echo "cert_path=$cert_path" >> "$GITHUB_OUTPUT"

      - name: Attest release APK and AAB
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.aab_path }}

      - name: Upload signed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: my-cycle-${{ env.RELEASE_TAG }}-signed
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.apk_checksum_path }}
            ${{ steps.package.outputs.aab_path }}
            ${{ steps.package.outputs.aab_checksum_path }}
            ${{ steps.package.outputs.cert_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/my-cycle-release.jks"
          rm -f "$RUNNER_TEMP/my-cycle-upload-cert.pem"
          echo 'ANDROID_KEYSTORE_PATH=' >> "$GITHUB_ENV"
          echo 'UPLOAD_CERT_PATH=' >> "$GITHUB_ENV"

  publish:
    name: Publish GitHub release
    needs: build-sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: my-cycle-${{ env.RELEASE_TAG }}-signed
          path: release

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi

      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/$RELEASE_TAG.md"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "My Cycle ${RELEASE_TAG#v}" \
            --notes-file "$notes_file" \
            --repo "$GITHUB_REPOSITORY"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Attach verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "release/My-Cycle-v$version.apk" \
            "release/My-Cycle-v$version.apk.sha256" \
            "release/My-Cycle-v$version.aab" \
            "release/My-Cycle-v$version.aab.sha256" \
            "release/My-Cycle-v$version-upload-cert.pem" \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"

      - name: Remove failed draft
        if: failure() && steps.draft.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$RELEASE_TAG" --yes --repo "$GITHUB_REPOSITORY"
