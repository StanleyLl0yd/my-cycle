name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/build.gradle.kts
      - .github/release-notes/**
      - .github/workflows/release.yml

permissions:
  contents: write
  checks: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Test, sign, and publish Android release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPECTED_CERT_SHA256: f02571c40741e2cb071564f5b63fd3dc38a875d0eda11a8c42269ed635bc2a58

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate trusted release source
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Releases must run from the protected main branch.' >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.5.0'

      - name: Resolve release version
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [[ -z "$app_version" ]]; then
            echo 'Could not read versionName from app/build.gradle.kts.' >&2
            exit 1
          fi
          echo "RELEASE_TAG=v$app_version" >> "$GITHUB_ENV"

      - name: Determine release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_exists=false
          release_exists=false

          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            tag_exists=true
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            release_exists=true
          fi

          if [[ "$tag_exists" == true || "$release_exists" == true ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "Release $RELEASE_TAG already exists. Bump the app version before publishing another release." >&2
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; automatic publication is not needed."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require successful main CI
        if: steps.release_state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..80}; do
            status="$(
              gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
                --jq '[.check_runs[] | select(.name == "build" and .app.slug == "github-actions") | {status: .status, conclusion: (.conclusion // "")}][0] // {status: "", conclusion: ""}'
            )"
            check_status="$(jq -r '.status' <<< "$status")"
            conclusion="$(jq -r '.conclusion' <<< "$status")"

            if [[ "$check_status" == "completed" && "$conclusion" == "success" ]]; then
              exit 0
            fi
            if [[ "$check_status" == "completed" && -n "$conclusion" ]]; then
              echo "Required main build check finished with $conclusion for $GITHUB_SHA." >&2
              exit 1
            fi
            sleep 15
          done

          echo "Timed out waiting for the required main build check for $GITHUB_SHA." >&2
          exit 1

      - name: Test and lint release source
        if: steps.release_state.outputs.publish == 'true'
        run: gradle --dependency-verification=strict test lint --stacktrace

      - name: Configure release signing
        if: steps.release_state.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          keystore_path="$RUNNER_TEMP/my-cycle-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

          keytool -exportcert -rfc \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/upload-cert.pem"

      - name: Build signed release APK and AAB
        if: steps.release_state.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --dependency-verification=strict assembleRelease bundleRelease --stacktrace

      - name: Remove release keystore
        if: always() && steps.release_state.outputs.publish == 'true'
        run: |
          rm -f "$RUNNER_TEMP/my-cycle-release.jks"
          echo 'ANDROID_KEYSTORE_PATH=' >> "$GITHUB_ENV"

      - name: Verify and package release
        if: steps.release_state.outputs.publish == 'true'
        id: package
        run: |
          set -euo pipefail
          source_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          source_aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -1)"
          test -n "$source_apk"
          test -n "$source_aab"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          apk_report="$RUNNER_TEMP/apksigner-report.txt"
          "$apksigner" verify --verbose --print-certs "$source_apk" | tee "$apk_report"
          grep -F 'Verified using v1 scheme (JAR signing): false' "$apk_report"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$apk_report"
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' "$apk_report"
          grep -F 'Number of signers: 1' "$apk_report"
          apk_fingerprint="$(
            awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$apk_report" |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"

          jarsigner -verify -strict -certs "$source_aab" > "$RUNNER_TEMP/jarsigner-report.txt"
          aab_fingerprint="$(
            keytool -printcert -jarfile "$source_aab" 2>/dev/null |
              sed -n 's/^[[:space:]]*SHA256: //p' |
              head -1 |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"

          if [[ "$apk_fingerprint" != "$EXPECTED_CERT_SHA256" || "$aab_fingerprint" != "$EXPECTED_CERT_SHA256" ]]; then
            echo 'Release signer certificate does not match the expected My Cycle key.' >&2
            exit 1
          fi

          mkdir -p release
          apk_path="release/My-Cycle-$RELEASE_TAG.apk"
          aab_path="release/My-Cycle-$RELEASE_TAG.aab"
          cert_path="release/My-Cycle-$RELEASE_TAG-upload-cert.pem"
          cp "$source_apk" "$apk_path"
          cp "$source_aab" "$aab_path"
          cp "$RUNNER_TEMP/upload-cert.pem" "$cert_path"
          sha256sum "$apk_path" | tee "$apk_path.sha256"
          sha256sum "$aab_path" | tee "$aab_path.sha256"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"
          echo "cert_path=$cert_path" >> "$GITHUB_OUTPUT"

      - name: Upload signed workflow artifact
        if: steps.release_state.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: My-Cycle-${{ env.RELEASE_TAG }}-signed
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.apk_path }}.sha256
            ${{ steps.package.outputs.aab_path }}
            ${{ steps.package.outputs.aab_path }}.sha256
            ${{ steps.package.outputs.cert_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: steps.release_state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk_path="${{ steps.package.outputs.apk_path }}"
          aab_path="${{ steps.package.outputs.aab_path }}"
          cert_path="${{ steps.package.outputs.cert_path }}"
          notes_file=".github/release-notes/$RELEASE_TAG.md"

          args=(
            "$RELEASE_TAG"
            "$apk_path"
            "$apk_path.sha256"
            "$aab_path"
            "$aab_path.sha256"
            "$cert_path"
            --target "$GITHUB_SHA"
            --title "My Cycle ${RELEASE_TAG#v}"
            --repo "$GITHUB_REPOSITORY"
          )

          if [[ -f "$notes_file" ]]; then
            args+=(--notes-file "$notes_file")
          else
            args+=(--generate-notes)
          fi

          gh release create "${args[@]}"
