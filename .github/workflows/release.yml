name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/build.gradle.kts
      - .github/release-notes/**
      - .github/workflows/release.yml

permissions:
  contents: write
  checks: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Test, sign, and publish AAB
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPECTED_CERT_SHA256: f02571c40741e2cb071564f5b63fd3dc38a875d0eda11a8c42269ed635bc2a58

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate trusted release source
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Releases must run from the protected main branch.' >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.5.0'

      - name: Resolve release version
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [[ -z "$app_version" ]]; then
            echo 'Could not read versionName from app/build.gradle.kts.' >&2
            exit 1
          fi
          echo "RELEASE_TAG=v$app_version" >> "$GITHUB_ENV"
          echo "AAB_NAME=My-Cycle-v$app_version.aab" >> "$GITHUB_ENV"

      - name: Determine release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_exists=false
          aab_exists=false

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            release_exists=true
            if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' | grep -Fxq "$AAB_NAME"; then
              aab_exists=true
            fi
          fi

          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"
          if [[ "$aab_exists" == true ]]; then
            echo "build_bundle=false" >> "$GITHUB_OUTPUT"
            echo "$AAB_NAME is already attached to $RELEASE_TAG."
          else
            echo "build_bundle=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require successful main quality gate
        if: steps.release_state.outputs.build_bundle == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..80}; do
            status="$(
              gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
                --jq '[.check_runs[] | select(.name == "build" and .app.slug == "github-actions") | {status: .status, conclusion: (.conclusion // "")}][0] // {status: "", conclusion: ""}'
            )"
            check_status="$(jq -r '.status' <<< "$status")"
            conclusion="$(jq -r '.conclusion' <<< "$status")"

            if [[ "$check_status" == "completed" && "$conclusion" == "success" ]]; then
              exit 0
            fi
            if [[ "$check_status" == "completed" && -n "$conclusion" ]]; then
              echo "Required main build check finished with $conclusion for $GITHUB_SHA." >&2
              exit 1
            fi

            sleep 15
          done

          echo "Timed out waiting for the required main build check for $GITHUB_SHA." >&2
          exit 1

      - name: Test and lint release source
        if: steps.release_state.outputs.build_bundle == 'true'
        run: ./gradlew --dependency-verification=strict test lint --stacktrace

      - name: Configure release signing
        if: steps.release_state.outputs.build_bundle == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          keystore_path="$RUNNER_TEMP/my-cycle-release.jks"
          upload_cert_path="$RUNNER_TEMP/my-cycle-upload-cert.pem"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "UPLOAD_CERT_PATH=$upload_cert_path" >> "$GITHUB_ENV"

          key_info="$(
            keytool -list -v \
              -keystore "$keystore_path" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS"
          )"

          grep -Eq 'Subject Public Key Algorithm: ([2-9][0-9]{3,}|[1-9][0-9]{4,})-bit RSA key' <<< "$key_info"

          actual_fingerprint="$(
            awk -F': ' '/SHA256:/ {print $2; exit}' <<< "$key_info" |
              tr -d ': ' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [[ "$actual_fingerprint" != "$EXPECTED_CERT_SHA256" ]]; then
            echo 'Signing certificate fingerprint does not match the My Cycle release key.' >&2
            exit 1
          fi

          keytool -exportcert \
            -rfc \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$upload_cert_path"
          test -s "$upload_cert_path"

      - name: Build signed release AAB
        if: steps.release_state.outputs.build_bundle == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --dependency-verification=strict bundleRelease --stacktrace

      - name: Verify certificate and package AAB
        if: steps.release_state.outputs.build_bundle == 'true'
        id: package
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          source_aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -1)"
          test -n "$source_aab"

          initial_report="$RUNNER_TEMP/jarsigner-initial.txt"
          jarsigner -verify -strict "$source_aab" > "$initial_report" 2>&1 || true
          if ! grep -Fq 'jar verified.' "$initial_report"; then
            jarsigner \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              "$source_aab" \
              "$ANDROID_KEY_ALIAS"
          fi

          jarsigner -verify -verbose -certs "$source_aab" > "$RUNNER_TEMP/jarsigner-report.txt"
          grep -F 'jar verified.' "$RUNNER_TEMP/jarsigner-report.txt"

          keytool -printcert -jarfile "$source_aab" > "$RUNNER_TEMP/aab-cert-report.txt"
          actual_fingerprint="$(
            awk -F': ' '/SHA256:/ {print $2; exit}' "$RUNNER_TEMP/aab-cert-report.txt" |
              tr -d ': ' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [[ "$actual_fingerprint" != "$EXPECTED_CERT_SHA256" ]]; then
            echo 'AAB certificate fingerprint does not match the My Cycle release key.' >&2
            exit 1
          fi

          mkdir -p release
          aab_path="release/$AAB_NAME"
          checksum_path="$aab_path.sha256"
          cert_path="release/My-Cycle-$RELEASE_TAG-upload-cert.pem"
          cp "$source_aab" "$aab_path"
          cp "$UPLOAD_CERT_PATH" "$cert_path"
          sha256sum "$aab_path" | tee "$checksum_path"

          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"
          echo "cert_path=$cert_path" >> "$GITHUB_OUTPUT"

      - name: Remove release keystore
        if: always() && steps.release_state.outputs.build_bundle == 'true'
        run: |
          rm -f "$RUNNER_TEMP/my-cycle-release.jks"
          echo 'ANDROID_KEYSTORE_PATH=' >> "$GITHUB_ENV"

      - name: Upload signed workflow artifact
        if: steps.release_state.outputs.build_bundle == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: My-Cycle-${{ env.RELEASE_TAG }}-signed-aab
          path: |
            ${{ steps.package.outputs.aab_path }}
            ${{ steps.package.outputs.checksum_path }}
            ${{ steps.package.outputs.cert_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update GitHub release
        if: steps.release_state.outputs.build_bundle == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          aab_path="${{ steps.package.outputs.aab_path }}"
          checksum_path="${{ steps.package.outputs.checksum_path }}"
          cert_path="${{ steps.package.outputs.cert_path }}"
          notes_file=".github/release-notes/$RELEASE_TAG.md"

          if [[ "${{ steps.release_state.outputs.release_exists }}" == "true" ]]; then
            gh release upload "$RELEASE_TAG" \
              "$aab_path" "$checksum_path" "$cert_path" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          elif [[ -f "$notes_file" ]]; then
            gh release create "$RELEASE_TAG" \
              "$aab_path" "$checksum_path" "$cert_path" \
              --target "$GITHUB_SHA" \
              --title "My Cycle ${RELEASE_TAG#v}" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              "$aab_path" "$checksum_path" "$cert_path" \
              --target "$GITHUB_SHA" \
              --title "My Cycle ${RELEASE_TAG#v}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Sync release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/$RELEASE_TAG.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && [[ -f "$notes_file" ]]; then
            gh release edit "$RELEASE_TAG" \
              --title "My Cycle ${RELEASE_TAG#v}" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          fi
