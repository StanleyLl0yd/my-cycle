name: Publish My Cycle 1.0.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v1.0.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Download verified unsigned APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9600222641/zip" \
            -o unsigned.zip
          mkdir unsigned
          unzip -q unsigned.zip -d unsigned
          test -f unsigned/app-release-unsigned.apk
          echo "fe77e55db94ee89606815e1fdf83225eaefe8fc9cfc332e3a47225f08c4cdc7f  unsigned/app-release-unsigned.apk" | sha256sum -c -

      - name: Reconstruct signed release APK
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
          base64 -d .github/release/v1.0.0-signature.patch.b64 > signature.patch.zst
          zstd -d \
            --patch-from=unsigned/app-release-unsigned.apk \
            signature.patch.zst \
            -o My-Cycle-v1.0.0.apk
          echo "d7d490b5204e33ba5d0a777f9883f9e15abf1979de473e56b1b225d85859e7a0  My-Cycle-v1.0.0.apk" | sha256sum -c -

      - name: Verify Android signature
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs My-Cycle-v1.0.0.apk | tee signature-verification.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature-verification.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" signature-verification.txt
          grep -q "CN=Stanley Lloyd" signature-verification.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          # My Cycle 1.0.0

          First public release of **My Cycle**, a simple and private period and cycle tracker for Android.

          ## Highlights
          - Period, mood, symptom and notes logging.
          - Calendar with confirmed period days and estimated fertile/ovulation windows.
          - Adaptive cycle estimates based on recent completed cycles.
          - Cycle statistics and recent history.
          - CSV export through the Android system file picker.
          - System, light, dark and dynamic-color appearance options.
          - English and Russian interface.
          - About section with description, author, version, license, privacy information and GitHub link.

          ## Privacy
          No account, analytics, ads or internet permission. Tracked data remains local unless the user explicitly exports it.

          ## Important
          Cycle, fertile-window and ovulation dates are estimates. My Cycle is not a medical device and should not be used as a contraceptive method or as a substitute for medical advice.

          **Author:** Stanley Lloyd  
          **Application ID:** `com.silverlightning.mycycle`  
          **License:** PolyForm Noncommercial License 1.0.0

          SHA-256 (`My-Cycle-v1.0.0.apk`): `d7d490b5204e33ba5d0a777f9883f9e15abf1979de473e56b1b225d85859e7a0`
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.0 My-Cycle-v1.0.0.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.0 My-Cycle-v1.0.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "My Cycle 1.0.0" \
              --notes-file release-notes.md
          fi
