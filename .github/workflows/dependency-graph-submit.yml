name: Dependency Graph Submit

on:
  workflow_run:
    workflows: ["Dependency Graph"]
    types: [completed]

permissions: {}

jobs:
  submit-pr:
    name: Submit PR dependency graph
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download dependency snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-snapshot
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s dependency-snapshot.json
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input dependency-snapshot.json
