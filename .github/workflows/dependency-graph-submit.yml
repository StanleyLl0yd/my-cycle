name: Dependency Graph Submit

on:
  workflow_run:
    workflows: ["Dependency Graph"]
    types: [completed]

permissions: {}

jobs:
  submit-pr:
    name: Submit PR dependency graph
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Submit saved Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          dependency-graph: download-and-submit
          cache-disabled: true
          add-job-summary: on-failure
