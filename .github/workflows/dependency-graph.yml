name: Dependency Graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-submit:
    name: Submit main dependency graph
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v5.0.0
        with:
          gradle-version: '9.5.0'

      - name: Resolve release runtime dependencies
        run: |
          set -euo pipefail
          ./gradlew --dependency-verification=strict :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --console=plain \
            > release-runtime-dependencies.txt

          python3 scripts/gradle_dependencies_to_github_snapshot.py \
            release-runtime-dependencies.txt \
            dependency-snapshot.json \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --job-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input dependency-snapshot.json

  pr-generate:
    name: Generate PR dependency graph
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v5.0.0
        with:
          gradle-version: '9.5.0'

      - name: Resolve PR release runtime dependencies
        env:
          SNAPSHOT_SHA: ${{ github.event.pull_request.head.sha }}
          SNAPSHOT_REF: refs/pull/${{ github.event.pull_request.number }}/head
        run: |
          set -euo pipefail
          ./gradlew --dependency-verification=strict :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --console=plain \
            > release-runtime-dependencies.txt

          python3 scripts/gradle_dependencies_to_github_snapshot.py \
            release-runtime-dependencies.txt \
            dependency-snapshot.json \
            --sha "$SNAPSHOT_SHA" \
            --ref "$SNAPSHOT_REF" \
            --job-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Upload dependency snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-snapshot
          path: dependency-snapshot.json
          if-no-files-found: error
          retention-days: 1
