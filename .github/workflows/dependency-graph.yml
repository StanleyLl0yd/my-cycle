name: Dependency Graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-submit:
    name: Submit main dependency graph
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Generate and submit release runtime dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: '9.5.0'
          additional-arguments: '--dependency-verification=strict'
          dependency-graph: generate-and-submit
          dependency-graph-include-configurations: '^releaseRuntimeClasspath$'
          validate-wrappers: true
          cache-provider: basic
          add-job-summary: on-failure

  pr-generate:
    name: Generate PR dependency graph
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Generate and save release runtime dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: '9.5.0'
          additional-arguments: '--dependency-verification=strict'
          dependency-graph: generate-and-upload
          dependency-graph-include-configurations: '^releaseRuntimeClasspath$'
          artifact-retention-days: 1
          validate-wrappers: true
          cache-provider: basic
          cache-read-only: true
          add-job-summary: on-failure
