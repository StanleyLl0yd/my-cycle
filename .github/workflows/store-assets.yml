name: RuStore Store Assets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/store-assets.yml
      - scripts/capture-rustore-screenshots.sh
      - store/rustore/**

permissions:
  contents: read

concurrency:
  group: rustore-assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Real app screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle --dependency-verification=strict assembleDebug --stacktrace

      - name: Install Android emulator image
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name rustore --package "system-images;android-35;google_apis;x86_64" --device "pixel_5"

      - name: Start portrait emulator
        run: |
          nohup emulator -avd rustore -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -skin 1080x1920 -prop persist.sys.locale=ru-RU > "$RUNNER_TEMP/emulator.log" 2>&1 &

      - name: Capture screenshots
        run: bash scripts/capture-rustore-screenshots.sh "$RUNNER_TEMP/rustore-screenshots"

      - name: Validate screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          root = Path("${{ runner.temp }}/rustore-screenshots")
          files = sorted(root.glob("*.png"))
          if len(files) < 3:
              raise SystemExit("RuStore requires at least three screenshots")
          expected_size = None
          for path in files:
              with path.open("rb") as stream:
                  signature = stream.read(8)
                  length = struct.unpack(">I", stream.read(4))[0]
                  chunk = stream.read(4)
                  if signature != b"\x89PNG\r\n\x1a\n" or chunk != b"IHDR" or length != 13:
                      raise SystemExit(f"{path.name}: invalid PNG")
                  width, height = struct.unpack(">II", stream.read(8))
              if height <= width or width * 16 != height * 9:
                  raise SystemExit(f"{path.name}: expected portrait 9:16")
              if expected_size is None:
                  expected_size = (width, height)
              elif (width, height) != expected_size:
                  raise SystemExit(f"{path.name}: inconsistent dimensions")
              if not (320 <= width <= 3840 and 320 <= height <= 3840):
                  raise SystemExit(f"{path.name}: dimensions outside RuStore limits")
              if path.stat().st_size > 5 * 1024 * 1024:
                  raise SystemExit(f"{path.name}: larger than 5 MB")
          print(f"validated {len(files)} screenshots at {expected_size[0]}x{expected_size[1]}")
          PY

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustore-screenshots
          path: ${{ runner.temp }}/rustore-screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustore-emulator-log
          path: ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 7
