name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  checks: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.5.0'

      - name: Check source comment policy
        run: python3 scripts/check-source-comments.py

      - name: Build APKs and run unit tests
        run: |
          set -o pipefail
          ./gradlew --dependency-verification=strict assembleDebug assembleRelease test --stacktrace 2>&1 | tee android-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Run lint
        run: ./gradlew --dependency-verification=strict lint

      - name: Run Detekt
        run: ./gradlew --dependency-verification=strict detekt

      - name: Require security checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=(CodeQL Semgrep Gitleaks Qodana)
          for attempt in {1..120}; do
            payload="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
            pending=()
            for name in "${required[@]}"; do
              state="$(jq -r --arg name "$name" '[.check_runs[] | select(.name == $name)] | sort_by(.id) | last | [(.status // ""), (.conclusion // "")] | @tsv' <<< "$payload")"
              status="${state%%$'\t'*}"
              conclusion="${state#*$'\t'}"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "$name finished with $conclusion." >&2
                  exit 1
                fi
              else
                pending+=("$name")
              fi
            done
            if (( ${#pending[@]} == 0 )); then
              echo 'All required security checks passed.'
              exit 0
            fi
            echo "Waiting for: ${pending[*]}"
            sleep 10
          done
          echo 'Timed out waiting for required security checks.' >&2
          exit 1

      - name: Print lint report on failure
        if: failure()
        run: |
          find app/build -name 'lint-results-*.txt' -o -name 'lint-results-*.html' | sort || true
          REPORT="$(find app/build -name 'lint-results-debug.txt' -o -name 'lint-results.txt' | head -1)"
          if [ -n "$REPORT" ]; then
            echo "--- $REPORT ---"
            cat "$REPORT"
          fi
