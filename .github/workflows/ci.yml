name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Restore release keystore when configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && \
             [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-cycle-release.jks"
            test -s "$RUNNER_TEMP/my-cycle-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/my-cycle-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "ANDROID_HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build APKs and run unit tests
        run: gradle assembleDebug assembleRelease test --stacktrace

      - name: Run lint
        run: gradle lint

      - name: Print lint report on failure
        if: failure()
        run: |
          find app/build -name 'lint-results-*.txt' -o -name 'lint-results-*.html' | sort || true
          REPORT="$(find app/build -name 'lint-results-debug.txt' -o -name 'lint-results.txt' | head -1)"
          if [ -n "$REPORT" ]; then
            echo "--- $REPORT ---"
            cat "$REPORT"
          fi

      - name: Upload signed release APK
        if: ${{ env.ANDROID_HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: my-cycle-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        if: ${{ env.ANDROID_HAS_RELEASE_SIGNING != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: my-cycle-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/my-cycle-release.jks"
