name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build APKs and run unit tests
        run: gradle assembleDebug assembleRelease test --stacktrace

      - name: Run lint
        run: gradle lint

      - name: Print lint report on failure
        if: failure()
        run: |
          find app/build -name 'lint-results-*.txt' -o -name 'lint-results-*.html' | sort || true
          REPORT="$(find app/build -name 'lint-results-debug.txt' -o -name 'lint-results.txt' | head -1)"
          if [ -n "$REPORT" ]; then
            echo "--- $REPORT ---"
            cat "$REPORT"
          fi

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: my-cycle-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
