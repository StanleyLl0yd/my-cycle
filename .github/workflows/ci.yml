name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v5.0.0
        with:
          gradle-version: '9.5.0'

      - name: Check source comment policy
        run: python3 scripts/check-source-comments.py

      - name: Verify approved launcher icon
        run: |
          set -euo pipefail
          cat <<'EOF' | sha256sum -c -
          26cf62dc67089b636df03edd7ed1c60f0db46ae7d77460c085e4069f8fe9542b  app/src/main/res/mipmap-mdpi/ic_launcher.webp
          47ab8d3efa5cf879355dac94354ef813f0d008ca4f9f2ad9421e5e0d05e27145  app/src/main/res/mipmap-hdpi/ic_launcher.webp
          13b5555a25333b6a1fdf7c1673dbaa68989a667fa1f313156207dbdb22abf46d  app/src/main/res/mipmap-xhdpi/ic_launcher.webp
          84db05a886175b67c23d45a99c3fbfe20a45166151711085e08ddd4f126b0afa  app/src/main/res/mipmap-xxhdpi/ic_launcher.webp
          feb0df2480c3826a5f17362279aea9974d30d6ad44b4852f460909be3028c8dd  app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          EOF
          test ! -e app/src/main/res/mipmap-mdpi/ic_launcher.png
          test ! -e app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -e app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test ! -e app/src/main/res/drawable/ic_launcher_background.xml
          test ! -e app/src/main/res/drawable/ic_launcher_foreground.xml

      - name: Build APKs and run unit tests
        run: |
          set -o pipefail
          ./gradlew --dependency-verification=strict assembleDebug assembleRelease testDebugUnitTest --stacktrace 2>&1 | tee android-build.log

      - name: Upload APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: my-cycle-apks-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-log-${{ github.sha }}
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Run Android lint
        run: ./gradlew --dependency-verification=strict lint --stacktrace

      - name: Run Detekt
        run: ./gradlew --dependency-verification=strict detekt --stacktrace

      - name: Print lint report on failure
        if: failure()
        run: |
          find app/build -name 'lint-results-*.txt' -o -name 'lint-results-*.html' | sort || true
          REPORT="$(find app/build -name 'lint-results-debug.txt' -o -name 'lint-results.txt' | head -1)"
          if [ -n "$REPORT" ]; then
            echo "--- $REPORT ---"
            cat "$REPORT"
          fi

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: true
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          show-patched-versions: true

  verify:
    name: Verify
    if: always()
    needs: [build, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Enforce verification results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = "success"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$DEPENDENCY_REVIEW_RESULT" = "success"
          else
            test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
          fi
