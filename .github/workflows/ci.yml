name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.5.0'

      - name: Check source comment policy
        run: python3 scripts/check-source-comments.py

      - name: Generate dependency verification metadata
        if: github.event_name == 'pull_request'
        run: |
          rm -f gradle/verification-metadata.xml
          gradle --write-verification-metadata sha256 assembleDebug assembleRelease test lint detekt --stacktrace || true
          test -s gradle/verification-metadata.xml

      - name: Commit dependency verification metadata
        if: github.event_name == 'pull_request'
        run: |
          git checkout "${{ github.event.pull_request.head.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if ! git diff --cached --quiet; then
            git commit -m "Add Gradle dependency verification metadata"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Build APKs and run unit tests
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease test --stacktrace 2>&1 | tee android-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Run lint
        run: gradle lint

      - name: Run Detekt
        run: gradle detekt

      - name: Print lint report on failure
        if: failure()
        run: |
          find app/build -name 'lint-results-*.txt' -o -name 'lint-results-*.html' | sort || true
          REPORT="$(find app/build -name 'lint-results-debug.txt' -o -name 'lint-results.txt' | head -1)"
          if [ -n "$REPORT" ]; then
            echo "--- $REPORT ---"
            cat "$REPORT"
          fi

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: my-cycle-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
