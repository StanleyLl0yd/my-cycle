name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v5.0.0
        with:
          gradle-version: '9.5.0'

      - name: Check source comment policy
        run: python3 scripts/check-source-comments.py

      - name: Verify approved launcher icon
        run: |
          set -euo pipefail
          cat <<'EOF' | sha256sum -c -
          26cf62dc67089b636df03edd7ed1c60f0db46ae7d77460c085e4069f8fe9542b  app/src/main/res/mipmap-mdpi/ic_launcher.webp
          47ab8d3efa5cf879355dac94354ef813f0d008ca4f9f2ad9421e5e0d05e27145  app/src/main/res/mipmap-hdpi/ic_launcher.webp
          13b5555a25333b6a1fdf7c1673dbaa68989a667fa1f313156207dbdb22abf46d  app/src/main/res/mipmap-xhdpi/ic_launcher.webp
          84db05a886175b67c23d45a99c3fbfe20a45166151711085e08ddd4f126b0afa  app/src/main/res/mipmap-xxhdpi/ic_launcher.webp
          feb0df2480c3826a5f17362279aea9974d30d6ad44b4852f460909be3028c8dd  app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          EOF
          test ! -e app/src/main/res/mipmap-mdpi/ic_launcher.png
          test ! -e app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -e app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test ! -e app/src/main/res/drawable/ic_launcher_background.xml
          test ! -e app/src/main/res/drawable/ic_launcher_foreground.xml

      - name: Build APKs and run unit tests
        run: |
          set -o pipefail
          ./gradlew --dependency-verification=strict assembleDebug assembleRelease testDebugUnitTest --stacktrace 2>&1 | tee android-build.log

      - name: Upload APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: my-cycle-apks-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-log-${{ github.sha }}
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Run Android lint
        run: ./gradlew --dependency-verification=strict lint --stacktrace

      - name: Run Detekt
        run: ./gradlew --dependency-verification=strict detekt --stacktrace

      - name: Print lint report on failure
        if: failure()
        run: |
          find app/build -name 'lint-results-*.txt' -o -name 'lint-results-*.html' | sort || true
          REPORT="$(find app/build -name 'lint-results-debug.txt' -o -name 'lint-results.txt' | head -1)"
          if [ -n "$REPORT" ]; then
            echo "--- $REPORT ---"
            cat "$REPORT"
          fi

  osv:
    name: OSV Runtime Dependency Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v5.0.0
        with:
          gradle-version: '9.5.0'

      - name: Resolve release runtime dependencies
        run: |
          set -euo pipefail
          ./gradlew --dependency-verification=strict :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --console=plain \
            > release-runtime-dependencies.txt
          python3 scripts/gradle_dependencies_to_osv.py \
            release-runtime-dependencies.txt \
            osv-scanner.json

      - name: Scan resolved runtime dependencies
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            ghcr.io/google/osv-scanner:v2.4.0@sha256:5116601dedc01c1c580eb92371883ec052fc4c13c3fbc109d621a63ac416d475 \
            scan source --lockfile=osv-scanner:/src/osv-scanner.json

  build:
    name: build
    if: always()
    needs: [checks, osv]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: read
      checks: read
      contents: read

    steps:
      - name: Enforce local verification results
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          OSV_RESULT: ${{ needs.osv.result }}
        run: |
          set -euo pipefail
          test "$CHECKS_RESULT" = "success"
          test "$OSV_RESULT" = "success"

      - name: Wait for security gates
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected=("Analyze Java and Kotlin" "Semgrep" "Gitleaks")

          for attempt in $(seq 1 135); do
            response="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs?per_page=100")"
            pending=0

            for check in "${expected[@]}"; do
              state="$(jq -r --arg name "$check" '
                [.check_runs[] | select(.name == $name)]
                | sort_by(.started_at)
                | last
                | if . == null then
                    "missing"
                  elif .status != "completed" then
                    .status
                  else
                    .conclusion
                  end
              ' <<< "$response")"

              case "$state" in
                success)
                  ;;
                missing|queued|in_progress|pending|requested|waiting)
                  pending=1
                  ;;
                *)
                  echo "$check finished with unacceptable state: $state" >&2
                  exit 1
                  ;;
              esac
            done

            if [ "$pending" -eq 0 ]; then
              echo "CodeQL, Semgrep and Gitleaks passed."
              exit 0
            fi

            sleep 20
          done

          echo "Timed out waiting for CodeQL, Semgrep and Gitleaks." >&2
          exit 1
