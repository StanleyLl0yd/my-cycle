name: RuStore Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - rustore-first-publish
    paths:
      - app/src/main/**
      - app/src/debug/**
      - app/src/test/**
      - app/schemas/**
      - app/build.gradle.kts
      - store/rustore/**
      - .github/workflows/store-screenshots.yml

permissions:
  contents: write

concurrency:
  group: rustore-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Refactor package identifier if needed
        id: package_refactor
        run: |
          set -euo pipefail

          old_id='com.silverlightning.mycycle'
          new_id='com.sl.mycycle'
          old_path='com/silverlightning/mycycle'
          new_path='com/sl/mycycle'

          if ! git grep -q "$old_id" -- . && ! git ls-files | grep -Eq 'com/silverlightning/mycycle|com\.silverlightning\.mycycle'; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git grep -IlZ "$old_id" -- . ':!gradle/verification-metadata.xml' |
            xargs -0 -r sed -i "s/${old_id//./\\.}/$new_id/g"

          while IFS= read -r -d '' path; do
            new="$path"
            new="${new//$old_path/$new_path}"
            new="${new//$old_id/$new_id}"
            if [[ "$new" != "$path" ]]; then
              mkdir -p "$(dirname "$new")"
              git mv "$path" "$new"
            fi
          done < <(git ls-files -z)

          if git grep -n "$old_id" -- . ':!gradle/verification-metadata.xml'; then
            echo 'Old application/package identifier remains in tracked content.' >&2
            exit 1
          fi

          if git ls-files | grep -E 'com/silverlightning/mycycle|com\.silverlightning\.mycycle'; then
            echo 'Old package identifier remains in tracked paths.' >&2
            exit 1
          fi

          grep -F 'namespace = "com.sl.mycycle"' app/build.gradle.kts
          grep -F 'applicationId = "com.sl.mycycle"' app/build.gradle.kts
          grep -F 'package com.sl.mycycle' app/src/main/java/com/sl/mycycle/MyCycleApp.kt
          grep -F 'package com.sl.mycycle' app/src/test/java/com/sl/mycycle/domain/engine/PredictionEngineTest.kt
          grep -F 'com.sl.mycycle.debug' .github/workflows/store-screenshots.yml
          grep -F 'com.sl.mycycle' store/rustore/listing.ru.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor package to com.sl.mycycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: steps.package_refactor.outputs.changed != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        if: steps.package_refactor.outputs.changed != 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.5.0'

      - name: Install emulator image
        if: steps.package_refactor.outputs.changed != 'true'
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          test -x "$sdkmanager"
          test -x "$avdmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | "$avdmanager" create avd \
            --force \
            --name rustore-phone \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Start emulator
        if: steps.package_refactor.outputs.changed != 'true'
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          "$ANDROID_HOME/emulator/emulator" \
            -avd rustore-phone \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot-load \
            -no-snapshot-save \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &

          adb wait-for-device
          for attempt in {1..120}; do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

      - name: Configure screenshot device
        if: steps.package_refactor.outputs.changed != 'true'
        run: |
          set -euo pipefail
          adb root || true
          adb wait-for-device
          adb shell 'setprop persist.sys.locale ru-RU; stop; sleep 5; start' || true
          adb wait-for-device
          for attempt in {1..120}; do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 2
          done

          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global policy_control immersive.full=*

      - name: Build and install debug app
        if: steps.package_refactor.outputs.changed != 'true'
        run: gradle installDebug --stacktrace

      - name: Seed local demo data
        if: steps.package_refactor.outputs.changed != 'true'
        run: |
          set -euo pipefail
          adb shell am broadcast \
            -a com.sl.mycycle.SEED_STORE_DEMO \
            -p com.sl.mycycle.debug
          sleep 3

      - name: Capture phone screenshots
        if: steps.package_refactor.outputs.changed != 'true'
        run: |
          set -euo pipefail
          mkdir -p store/rustore/screenshots/phone

          adb shell am force-stop com.sl.mycycle.debug
          adb shell am start -W \
            -n com.sl.mycycle.debug/com.sl.mycycle.ui.MainActivity
          sleep 2

          adb exec-out screencap -p > store/rustore/screenshots/phone/01-today.png

          adb shell input tap 405 1810
          sleep 1
          adb exec-out screencap -p > store/rustore/screenshots/phone/02-calendar.png

          adb shell input tap 675 1810
          sleep 1
          adb exec-out screencap -p > store/rustore/screenshots/phone/03-statistics.png

          adb shell input tap 945 1810
          sleep 1
          adb exec-out screencap -p > store/rustore/screenshots/phone/04-settings.png

      - name: Validate screenshots
        if: steps.package_refactor.outputs.changed != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          paths = sorted(Path("store/rustore/screenshots/phone").glob("*.png"))
          if len(paths) < 3:
              raise SystemExit("RuStore requires at least three phone screenshots")

          for path in paths:
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit(f"{path} is not a valid PNG")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != (1080, 1920):
                  raise SystemExit(f"{path} has unexpected dimensions {(width, height)}")
              if len(data) > 3 * 1024 * 1024:
                  raise SystemExit(f"{path} exceeds 3 MB")
              print(f"{path}: 1080x1920, {len(data)} bytes")
          PY

      - name: Upload screenshot artifact
        if: steps.package_refactor.outputs.changed != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: My-Cycle-RuStore-screenshots
          path: store/rustore/screenshots/phone/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit screenshots to preparation branch
        if: github.event_name == 'push' && steps.package_refactor.outputs.changed != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/rustore/screenshots/phone
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
            exit 0
          fi
          git commit -m "Add RuStore screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
