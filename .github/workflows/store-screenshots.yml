name: RuStore Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustore-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate application identity
        run: |
          set -euo pipefail
          expected_id='com.sl.mycycle'
          legacy_id='com.silver''lightning.mycycle'
          legacy_path='com/silver''lightning/mycycle'

          grep -F "namespace = \"$expected_id\"" app/build.gradle.kts
          grep -F "applicationId = \"$expected_id\"" app/build.gradle.kts
          grep -F "package $expected_id" app/src/main/java/com/sl/mycycle/MyCycleApp.kt
          grep -F "package $expected_id" app/src/test/java/com/sl/mycycle/domain/engine/PredictionEngineTest.kt
          grep -F "package $expected_id.debug" app/src/debug/java/com/sl/mycycle/debug/StoreScreenshotActivity.kt

          if git grep -Fq "$legacy_id" -- .; then
            echo 'Legacy application identifier remains in tracked content.' >&2
            exit 1
          fi
          if git ls-files | grep -Fq -e "$legacy_path" -e "$legacy_id"; then
            echo 'Legacy package path remains in tracked files.' >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle --dependency-verification=strict assembleDebug --stacktrace

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate RuStore screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/capture-rustore-screenshots.sh

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: My-Cycle-RuStore-screenshots
          path: store/rustore/screenshots/phone/*.png
          if-no-files-found: error
          retention-days: 30
